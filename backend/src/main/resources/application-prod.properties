# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# MongoDB Database Connection
spring.data.mongodb.uri=mongodb://localhost:27017/enterprise_db

# Redis Caching Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Elasticsearch Connection URIs
spring.elasticsearch.uris=http://localhost:9200

# AWS S3 Cloud Storage Credentials
aws.s3.bucket-name=enterprise-s3-bucket
aws.s3.access-key=YOUR_ACCESS_KEY
aws.s3.secret-key=YOUR_SECRET_KEY

# SMTP Mail Server
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
